<ion-item>
  @if(years()) {
  <ion-select
    style="height: 56px"
    label="Año de facturación"
    interface="popover"
    okText="Aceptar"
    cancelText="Cancelar"
    [(ngModel)]="filter"
    placeholder="Selección año"
  >
    @for (year of years(); track $index) {
    <ion-select-option [value]="year">{{ year }}</ion-select-option>
    }
  </ion-select>
  }
</ion-item>
