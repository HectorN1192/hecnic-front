<app-header-page title="Productos" />

<ion-content class="ion-padding" [fullscreen]="true">
  <ion-row>
    <ion-col size="12">
      <ion-button [routerLink]="['create']" expand="block">
        Nuevo Producto
      </ion-button>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="12">
      <ion-item>
        <ion-input
          label="Buscar producto"
          labelPlacement="floating"
          placeholder="Buscar producto"
          [(ngModel)]="filterProduct"
          (keyup)="updateFilter($event)"
        ></ion-input>
      </ion-item>
    </ion-col>
  </ion-row>
  @if (rows$ | async; as rows) {
  <ngx-datatable
    #table
    class="material"
    [messages]="{ emptyMessage: 'No hay productos con ese filtro' }"
    [scrollbarH]="true"
    [limit]="10"
    [rows]="rows"
    [rowHeight]="50"
    [columns]="columns"
    [columnMode]="'force'"
    [sorts]="[{ prop: 'id_product', dir: 'asc' }]"
    [sortType]="sortType.multi"
    [headerHeight]="50"
    [footerHeight]="50"
  >
  </ngx-datatable>
  }

  <ng-template #actions let-row="row" let-value="value" let-i="index">
    <div class="btn-actions">
      <ion-icon
        tabindex="-1"
        class="icon-actions"
        slot="start"
        [name]="'create-outline'"
        [routerLink]="[RouteActions.EDIT, row.id_product]"
      ></ion-icon>

      <ion-icon
        tabindex="-1"
        class="icon-actions"
        slot="icon-only"
        name="trash-outline"
        (click)="presentAlertDelete(row)"
      ></ion-icon>
    </div>
  </ng-template>
</ion-content>
