<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-row>
    <ion-col size="12">
      <ion-button [routerLink]="[RouteActions.CREATE]" expand="block">
        Nuevo cliente
      </ion-button>
    </ion-col>
  </ion-row>

  <ion-row>
    <ion-col size="12">
      <ion-item>
        <ion-input
          label="Buscar cliente"
          labelPlacement="floating"
          placeholder="Buscar cliente"
        ></ion-input>
      </ion-item>
    </ion-col>
  </ion-row>
</ion-content>
