<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Editar cliente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="formClient" (ngSubmit)="submit()">
    <ion-row>
      <ion-col size="12">
        <ion-item
          ><ion-input
            type="text"
            label="Nombre"
            labelPlacement="floating"
            placeholder="Nombre"
            formControlName="name"
          ></ion-input></ion-item
      ></ion-col>
      <ion-col size="12" sizeMd="6">
        <ion-item
          ><ion-input
            type="text"
            label="CIF"
            labelPlacement="floating"
            placeholder="CIF"
            formControlName="cif"
          ></ion-input></ion-item
      ></ion-col>
      <ion-col size="12" sizeMd="6">
        <ion-item
          ><ion-input
            type="phone"
            label="Telefono"
            labelPlacement="floating"
            placeholder="Telefono"
            formControlName="phone"
          ></ion-input></ion-item
      ></ion-col>
      <ion-col size="12">
        <ion-item
          ><ion-input
            type="text"
            label="Dirección"
            labelPlacement="floating"
            placeholder="Dirección"
            formControlName="address"
          ></ion-input></ion-item
      ></ion-col>

      <ion-col size="12" sizeMd="4">
        <ion-item
          ><ion-input
            type="text"
            label="Provincia"
            labelPlacement="floating"
            placeholder="Provincia"
            formControlName="province"
          ></ion-input></ion-item
      ></ion-col>
      <ion-col size="12" sizeMd="4">
        <ion-item
          ><ion-input
            type="text"
            label="Ciudad"
            labelPlacement="floating"
            placeholder="Ciudad"
            formControlName="city"
          ></ion-input></ion-item
      ></ion-col>
      <ion-col size="12" sizeMd="4">
        <ion-item
          ><ion-input
            type="text"
            label="Codigo Postal"
            labelPlacement="floating"
            placeholder="Codigo Postal"
            formControlName="postal_code"
          ></ion-input></ion-item
      ></ion-col>
    </ion-row>

    <!-- emails -->
    <ion-toolbar color="light">
      <ion-title slot="start">Emails del cliente</ion-title>
    </ion-toolbar>
    @if (emailsFormArray.length == 0) {
    <ion-item>
      <ion-label>El cliente no tiene emails asociados</ion-label>
    </ion-item>
    }
    <ng-container formArrayName="emails">
      @for (emailControl of emailsFormArray.controls; track $index; let i =
      $index) {
      <ion-item [formGroupName]="$index">
        <ion-icon
          class="ion-align-self-center"
          slot="end"
          name="trash-outline"
          (click)="removeEmail(emailsFormArray.controls[i].value, i)"
        ></ion-icon>
        <ion-input
          type="text"
          type="text"
          label="Email"
          labelPlacement="floating"
          placeholder="Email"
          formControlName="email"
        ></ion-input>
      </ion-item>
      }
      <ion-row>
        <ion-col size="12">
          <ion-button class="ion-float-right" (click)="addEmail()"
            >Añadir email</ion-button
          >
        </ion-col>
      </ion-row>
    </ng-container>
    <ion-button expand="full" type="submit" [disabled]="formClient.invalid">
      Guardar
    </ion-button>
  </form>
</ion-content>
