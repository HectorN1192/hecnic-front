<app-header-page title="Facturas" />

<ion-content class="ion-padding">
  <ion-row>
    <ion-col size="12">
      <ion-button [routerLink]="RouteActions.CREATE" expand="block">
        Nueva Factura
      </ion-button>
    </ion-col>
  </ion-row>

  <ion-row>
    <ion-col sizeLg="6" sizeXs="12">
      <ion-item>
        <ion-label position="floating"></ion-label>
        <ion-input
          label="Buscar factura"
          labelPlacement="floating"
          placeholder="Buscar factura"
          [(ngModel)]="filterInvoice"
          type="text"
          (keyup)="updateFilter($event)"
        ></ion-input>
      </ion-item>
    </ion-col>
    <ion-col sizeLg="6" sizeXs="12">
      <app-filter-year
        [years]="years$ | async"
        (changeYear)="filterYear($event)"
      ></app-filter-year>
    </ion-col>
  </ion-row>

  @if (rows$ |async; as rows) {
  <ngx-datatable
    #table
    class="material"
    [messages]="{ emptyMessage: 'No hay facturas con ese filtro' }"
    [scrollbarH]="true"
    [limit]="10"
    [rowHeight]="50"
    [rows]="rows"
    [columns]="columns"
    [columnMode]="'force'"
    [sorts]="[{ prop: 'creationDate', dir: 'asc' }]"
    [sortType]="sortType.multi"
    [headerHeight]="50"
    [footerHeight]="50"
  >
  </ngx-datatable>
  }

  <ng-template #actions let-row="row" let-value="value" let-i="index">
    <div class="btn-actions">
      <ion-icon
        tabindex="-1"
        class="icon-actions"
        slot="start"
        name="copy-outline"
        aria-label="Copiar anterior"
        [routerLink]="[RouteActions.COPY, row.id_invoice]"
      ></ion-icon>
      <ion-icon
        tabindex="-1"
        class="icon-actions"
        slot="start"
        name="create-outline"
        aria-label="Editar"
        [routerLink]="[RouteActions.EDIT, row.id_invoice]"
      ></ion-icon>
      <ion-icon
        tabindex="-1"
        class="icon-actions"
        slot="start"
        name="print-outline"
        aria-label="Imprimir"
        (click)="createInvoicePDF(row.id_invoice, row.number_invoice)"
      ></ion-icon>
      <ion-icon
        tabindex="-1"
        class="icon-actions"
        slot="start"
        name="mail-open-outline"
        aria-label="Enviar por email"
        (click)="sendInvoicePDF(row.id_invoice, row.client.emails)"
      ></ion-icon>
    </div>
  </ng-template>
</ion-content>
