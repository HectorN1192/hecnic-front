<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard/budget"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del Presupuestos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="formBudget" (ngSubmit)="submit()">
    <ion-grid fixed>
      <ion-row>
        <ion-col sizeXs="12" sizeMd="12">
          <ion-item>
            <ion-label for="fechapresupuesto">Fecha presupuesto</ion-label>
            <ion-datetime-button
              datetime="datetimeBudget"
            ></ion-datetime-button>

            <ion-modal [keepContentsMounted]="true">
              <ng-template>
                <ion-datetime
                  id="datetimeBudget"
                  presentation="date"
                  [showDefaultButtons]="true"
                  doneText="Aceptar"
                  cancelText="Cancelar"
                  [showDefaultTitle]="true"
                  formControlName="creation_date"
                >
                  <span slot="title">Fecha presupuesto</span></ion-datetime
                >
              </ng-template>
            </ion-modal>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          @if (constructions$ | async; as constructions) {
          <app-selectable
            [items]="constructions"
            labelKey="name"
            valueKey="id_construction"
            placeholder="Obra"
            [selectedValueInput]="constructionSelected"
            (selectionChange)="onConstructionSelected($event)"
          >
          </app-selectable>
          }
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-item>
            <ion-input
              type="text"
              label="Cliente"
              labelPlacement="floating"
              [value]="formBudget.controls.client.value?.name"
              [readonly]="true"
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
      <div>
        <ion-toolbar color="primary">
          <ion-title slot="start">Lineas de presupuesto</ion-title>
        </ion-toolbar>

        <ng-container formArrayName="items">
          @for (itemControl of itemsFormArray.controls; track $index) {
          <ng-container [formGroupName]="$index">
            <app-budget-item
              [formItem]="itemControl"
              [products]="products$ | async"
              (deleteItem)="removeItem($index, itemControl)"
            ></app-budget-item>
          </ng-container>
          }
        </ng-container>
        <ion-row>
          <ion-col size="12">
            <ion-button class="ion-float-right" (click)="addItem()"
              >Añadir linea</ion-button
            >
          </ion-col>
        </ion-row>
      </div>

      <ion-button expand="full" type="submit" [disabled]="formBudget.invalid"
        >Guardar</ion-button
      >
    </ion-grid>
  </form>
</ion-content>
